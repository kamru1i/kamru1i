      <stop offset="18%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="52%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="82%" stop-color="#A78BFA" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="52" y1="78" x2="52" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <radialGradient id="glowCobalt" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 40) scale(440 240)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
